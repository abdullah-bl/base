name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install --frozen-lockfile
      - name: Check
        run: bun run check
        env:
          BETTER_AUTH_SECRET: ci-test-secret-at-least-32-characters
          NODE_ENV: test
      - name: Generate client
        run: bun run generate:client
