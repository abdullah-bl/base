name: Release binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build admin UI
        run: bun run build:admin

      - name: Typecheck & test
        run: bun run check
        env:
          BETTER_AUTH_SECRET: ci-test-secret-at-least-32-characters
          NODE_ENV: test

      - name: Compile binaries
        run: bun run scripts/build-binaries.ts

      - name: Checksums
        run: |
          cd dist
          sha256sum base-linux-x64 base-linux-arm64 base-darwin-arm64 base-windows-x64.exe > sha256sums.txt
          cat sha256sums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: base-binaries
          path: |
            dist/base-*
            dist/sha256sums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/base-linux-x64
            dist/base-linux-arm64
            dist/base-darwin-arm64
            dist/base-windows-x64.exe
            dist/sha256sums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
