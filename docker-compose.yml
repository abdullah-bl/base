# Base BaaS — Docker Compose for local development
# Includes: Base app + MinIO (S3-compatible for file storage testing)

services:
  base:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./collections.ts:/app/collections.ts
    environment:
      - PORT=3000
      - DATABASE_URL=file:./data/app.db
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-dev-secret-change-me}
      - BETTER_AUTH_URL=http://localhost:3000
      - CORS_ORIGINS=*
      - STORAGE_PATH=./data/uploads
      - MAX_FILE_SIZE=52428800

  # MinIO — S3-compatible storage for testing file uploads + Litestream replicas
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    profiles:
      - storage

volumes:
  minio-data:
