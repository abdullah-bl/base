# Base BaaS — Docker Compose for local development
# Includes: Base app + optional Litestream + MinIO

services:
  base:
    build:
      context: .
      target: base
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./collections.ts:/app/collections.ts
    environment:
      - PORT=3000
      - NODE_ENV=development
      - DATABASE_URL=file:./data/app.db
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=http://localhost:3000
      - CORS_ORIGINS=http://localhost:3000
      - STORAGE_DRIVER=${STORAGE_DRIVER:-local}
      - STORAGE_PATH=./data/uploads
      - MAX_FILE_SIZE=52428800
      - HARD_DELETE_ENABLED=false
      - REALTIME_ENABLED=true
      - ADMIN_ENABLED=true
      - ADMIN_PATH=/_
      - BACKUP_DIR=./data/backups
      - LOG_PERSIST=true
      # Uncomment for MinIO uploads (profile: storage):
      # - STORAGE_DRIVER=s3
      # - S3_BUCKET=base-uploads
      # - S3_ENDPOINT=http://minio:9000
      # - S3_REGION=us-east-1
      # - S3_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      # - S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}

  # Litestream continuous replication sidecar
  # Start with: docker compose --profile replicate up
  litestream:
    build:
      context: .
      target: litestream
    volumes:
      - ./data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    environment:
      - LITESTREAM_BUCKET=${LITESTREAM_BUCKET:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-minioadmin}}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin}}
    depends_on:
      - base
    profiles:
      - replicate

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    profiles:
      - storage

volumes:
  minio-data:
