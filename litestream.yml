# Litestream configuration for Base BaaS
# Streams SQLite WAL changes to S3-compatible storage for disaster recovery.
#
# Usage: litestream replicate -config litestream.yml
#
# Environment variables needed:
#   LITESTREAM_BUCKET     — S3 bucket name
#   S3_ENDPOINT           — S3 endpoint (AWS, R2, B2, MinIO)
#   S3_REGION             — S3 region
#   S3_ACCESS_KEY_ID      — S3 access key
#   S3_SECRET_ACCESS_KEY  — S3 secret key

dbs:
  - path: ./data/app.db
    replicas:
      - type: s3
        bucket: ${LITESTREAM_BUCKET}
        path: base
        endpoint: ${S3_ENDPOINT}
        region: ${S3_REGION}
        access-key-id: ${S3_ACCESS_KEY_ID}
        secret-access-key: ${S3_SECRET_ACCESS_KEY}
        sync-interval: 1s
        retention: 72h
        snapshot-interval: 1h
